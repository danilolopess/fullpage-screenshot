<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    #capture {
      background-color: #4285f4;
      color: white;
    }

    #capture:hover {
      background-color: #3367d6;
    }

    #capture:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #progress-container {
      margin-top: 10px;
      display: none;
    }

    progress {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      appearance: none;
    }

    progress::-webkit-progress-bar {
      background-color: #e0e0e0;
      border-radius: 3px;
    }

    progress::-webkit-progress-value {
      background-color: #4285f4;
      border-radius: 3px;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h2>Screenshot</h2>
  <button id="capture">Capture Full Page</button>
  <button id="stop" style="display: none; background-color: #d93025; color: white; margin-top: 10px;">Stop Capture</button>
  <div id="progress-container">
    <progress id="progress" value="0" max="100"></progress>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
